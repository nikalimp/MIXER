# PR агента: проверка → автослияние → выкладка (deploy-kit pr.yml + site.yml). Стандарт — «Публикация — стандарт» §4.
# Ветка claude/* с зелёным check сливается сама и сразу выкладывается этим же запуском:
# слияние токеном GITHUB_TOKEN не запускает deploy.yml. Метка needs-nik или правка .github/ и publish.json — ждёт Ника.
# Значения with: у job deploy — те же, что в deploy.yml (паспорт publish.json).
name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
concurrency: { group: "pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  pr:
    permissions: { contents: write, pull-requests: write }
    uses: nikalimp/deploy-kit/.github/workflows/pr.yml@main
    with:
      site_dir: "."
  deploy:
    needs: pr
    if: needs.pr.outputs.merged == 'true'
    concurrency: { group: deploy, cancel-in-progress: false }
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@main
    with:
      ref: main
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      url: https://mixerekb.ru
    # папки на сервере — прямо здесь, не в секретах: так боевая и тестовая выкладки не перепутаются
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ 'www/mixerekb.ru/' }}
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
  # Тестовая копия на техническом домене — та же версия, параллельно с боевой (стандарт «Боевой + тестовый»).
  # Сборка с NEXT_PUBLIC_STAGING=1: noindex, robots Disallow, без Метрики, плашка «Тестовая версия», заявки с пометкой [ТЕСТ].
  # Идёт после боевой: IndexNow сравнивает с уже обновлённым боевым сайтом и ничего лишнего не отправляет.
  staging:
    needs: [pr, deploy]
    if: needs.pr.outputs.merged == 'true'
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@main
    with:
      ref: main
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      url: https://mixer.nikalimp.ru
      build_command: NEXT_PUBLIC_STAGING=1 npm run build
      pagespeed: ""
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ 'www/mixer.nikalimp.ru/' }}
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
